# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [ push, pull_request ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: 25
                  distribution: 'temurin'
            # `build` also runs the database tests against SQLite.
            - name: Build artifacts
              run: ./gradlew build
            - name: Database tests (H2)
              run: ./gradlew test
              env:
                  VIALOGIUM_TEST_DB: H2
            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifacts
                  path: build/libs

    # The same database tests against the server databases a network uses.
    database:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - db: POSTGRESQL
                      image: postgres:16
                      port: 5432
                      health: pg_isready -U vialogium
                    - db: MARIADB
                      image: mariadb:11
                      port: 3306
                      health: healthcheck.sh --connect --innodb_initialized
                    - db: MYSQL
                      image: mysql:8.4
                      port: 3306
                      health: mysqladmin ping -h 127.0.0.1 -uvialogium -pvialogium
        name: database (${{ matrix.db }})

        services:
            db:
                image: ${{ matrix.image }}
                ports:
                    - ${{ matrix.port }}:${{ matrix.port }}
                # Each image reads only its own variables.
                env:
                    POSTGRES_USER: vialogium
                    POSTGRES_PASSWORD: vialogium
                    POSTGRES_DB: vialogium
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: vialogium
                    MARIADB_USER: vialogium
                    MARIADB_PASSWORD: vialogium
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: vialogium
                    MYSQL_USER: vialogium
                    MYSQL_PASSWORD: vialogium
                options: >-
                    --health-cmd "${{ matrix.health }}"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20

        steps:
            - uses: actions/checkout@v4
            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: 25
                  distribution: 'temurin'
            - name: Database tests
              run: ./gradlew test
              env:
                  VIALOGIUM_TEST_DB: ${{ matrix.db }}
                  VIALOGIUM_TEST_URL: 127.0.0.1:${{ matrix.port }}/vialogium
                  VIALOGIUM_TEST_USER: vialogium
                  VIALOGIUM_TEST_PASSWORD: vialogium
